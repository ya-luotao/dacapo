name: Pages

# The web app moved to https://playdacapo.com (Cloudflare Workers, wrangler.jsonc). This keeps the
# old address, https://ya-luotao.github.io/dacapo/, sending every link there: the same page,
# served as index.html and as 404.html, redirects to the same path and route.

on:
  push:
    branches: [main]
    paths:
      - scripts/moved/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          mkdir site
          cp scripts/moved/index.html site/index.html
          cp scripts/moved/index.html site/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
