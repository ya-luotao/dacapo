<!doctype html>
<!-- The social card and GitHub social preview. Rendered by render.sh at the window size.
     The system's sans, white, one red: the app's own look. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: Bravura;
        src: url('../../node_modules/@vexflow-fonts/bravura/bravura.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #ffffff;
        color: #1d1d1f;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      }
      .card {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100%;
        padding: 0 96px;
      }
      .mark {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 104px;
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .mark svg {
        height: 0.62em;
        fill: currentColor;
      }
      .tagline {
        margin: 26px 0 0;
        font:
          500 44px/1.2 -apple-system,
          sans-serif;
      }
      .staff {
        display: block;
        width: 100%;
        height: 132px;
        margin: 44px 0 34px;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        color: #6e6e73;
        font:
          500 22px/1.3 -apple-system,
          'PingFang SC',
          sans-serif;
      }
      .langs span:lang(ja) {
        font-family: 'Hiragino Sans', sans-serif;
      }
      .langs span:lang(ko) {
        font-family: 'Apple SD Gothic Neo', sans-serif;
      }
      .langs span:lang(zh-TW) {
        font-family: 'PingFang TC', sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="mark" aria-label="dacapo">
        <svg viewBox="0 -476 802 476" aria-hidden="true"><use href="#note" /></svg>dacapo
      </p>
      <p class="tagline">Read the staff. Find the key.</p>
      <!-- A treble staff with one whole note (G4) in the felt red, over the felt strip. -->
      <svg class="staff">
        <g stroke="#8e8e93" stroke-width="1.6">
          <line x1="0" x2="100%" y1="30" y2="30" />
          <line x1="0" x2="100%" y1="48" y2="48" />
          <line x1="0" x2="100%" y1="66" y2="66" />
          <line x1="0" x2="100%" y1="84" y2="84" />
          <line x1="0" x2="100%" y1="102" y2="102" />
        </g>
        <text x="14" y="84" font-family="Bravura" font-size="72" fill="#1d1d1f">&#xE050;</text>
        <text x="55%" y="84" font-family="Bravura" font-size="72" fill="#a8342b">&#xE0A2;</text>
      </svg>
      <div class="foot">
        <span class="langs"
          >English · <span lang="zh-CN">简体中文</span> · <span lang="zh-TW">繁體中文</span> ·
          <span lang="ja">日本語</span> · <span lang="ko">한국어</span></span
        >
        <span>playdacapo.com</span>
      </div>
    </div>
    <svg width="0" height="0" style="position: absolute">
      <defs>
        <path
          id="note"
          d="M410 -476C158 -476 0 -371 0 -242C0 -114 108 0 391 0C703 0 802 -109 802 -242C802 -377 587 -476 410 -476ZM211 -358C232 -424 302 -434 361 -434C492 -434 597 -293 597 -179C597 -120 572 -67 509 -52C490 -46 469 -44 450 -44C382 -44 312 -90 272 -143C234 -187 205 -251 205 -312C205 -327 207 -342 211 -358Z"
        />
      </defs>
    </svg>
  </body>
</html>
