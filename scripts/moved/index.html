<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>dacapo has moved to playdacapo.com</title>
    <link rel="canonical" href="https://playdacapo.com/" />
    <script>
      // The old address, https://ya-luotao.github.io/dacapo/…, served on GitHub Pages as index.html
      // and as 404.html: every link goes to the same page and route (#/settings) at the new one.
      location.replace(
        'https://playdacapo.com/' +
          location.pathname.replace(/^\/dacapo\/?/, '') +
          location.search +
          location.hash,
      );
    </script>
    <meta http-equiv="refresh" content="0; url=https://playdacapo.com/" />
  </head>
  <body>
    <p>dacapo has moved to <a href="https://playdacapo.com/">playdacapo.com</a>.</p>
  </body>
</html>
